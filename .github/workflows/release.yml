name: Release

run-name: Release v${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched on main (got ${GITHUB_REF}). Re-run with --ref main / 'Use workflow from: main'."
            exit 1
          fi

      - name: Validate version format
        run: |
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version '${VERSION}' is not plain semver X.Y.Z (no leading 'v', no suffix)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with latest release tag
        run: |
          LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          LATEST="${LATEST#v}"
          if [ -n "${LATEST}" ] && [ "${LATEST}" != "${VERSION}" ] \
            && [ "$(printf '%s\n%s\n' "${LATEST}" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
            echo "::warning::Version ${VERSION} is not greater than the latest tag v${LATEST}."
          fi

  tests:
    needs: [preflight]
    uses: ./.github/workflows/tests.yml

  release:
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create tag and push

    steps:
      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${TAG} already exists."
            exit 1
          fi

      # An existing tag is reused only if it is on main (e.g. re-running after the
      # tag was pushed but the release step failed). A tag off main would make the
      # auto-generated release notes wrong, so refuse it.
      - name: Create tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
              echo "::error::Tag ${TAG} already exists but points at $(git rev-parse --short "${TAG}^{commit}"), which is not on main. Delete it (git push origin :refs/tags/${TAG}) and re-run, or release a different version from main."
              exit 1
            fi
            echo "Tag ${TAG} already exists on main — reusing it"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: |
            ## Denon AVR Proxy v${{ github.event.inputs.version }}

          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
